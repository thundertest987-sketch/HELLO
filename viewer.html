
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewer</title>
  <style>
    body {
      max-width: 950px;
      margin: 35px auto;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    button {
      padding: 13px 18px;
      margin: 5px;
      border: 0;
      border-radius: 6px;
      background: #111;
      color: white;
      cursor: pointer;
    }
    button:disabled { background: #ddd; color: #888; }
    video {
      width: 100%;
      max-height: 70vh;
      background: #111;
      border-radius: 12px;
      margin-top: 15px;
    }
    #status {
      padding: 15px;
      background: #eef3f8;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>Viewer</h1>
  <p>Viewer authentication runs automatically. The streamer must start the camera.</p>

  <button id="front" disabled>Switch to Front Camera</button>
  <button id="back" disabled>Switch to Back Camera</button>
  <button id="disconnect" disabled>Disconnect</button>

  <div id="status">Authenticating viewer…</div>
  <video id="remoteVideo" autoplay playsinline controls></video>

<script>
"use strict";

const WORKER_URL =
  "https://private-camera-signal.thundertest987.workers.dev";
const VIEWER_SECRET = "CAMERA_VIEWER_SECRET";
const AUTH_URL = WORKER_URL + "/auth";
const SIGNAL_URL = WORKER_URL.replace(/^https:/, "wss:") + "/session";

let token = null;
let socket = null;
let peer = null;
let stopped = false;

const statusBox = document.getElementById("status");
const remoteVideo = document.getElementById("remoteVideo");
const frontButton = document.getElementById("front");
const backButton = document.getElementById("back");
const disconnectButton = document.getElementById("disconnect");

function status(message) {
  statusBox.textContent = message;
}

function send(message) {
  if (!socket || socket.readyState !== WebSocket.OPEN) {
    status("Signaling connection is not ready.");
    return false;
  }
  socket.send(JSON.stringify(message));
  return true;
}

async function authenticate() {
  const response = await fetch(AUTH_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      role: "viewer",
      secret: VIEWER_SECRET
    })
  });

  if (!response.ok) {
    throw new Error("Viewer authentication failed: HTTP " + response.status);
  }

  const data = await response.json();
  if (!data.token) throw new Error("No token returned by Worker.");
  token = data.token;
}

function connectSignaling() {
  return new Promise((resolve, reject) => {
    socket = new WebSocket(SIGNAL_URL);
    let authenticated = false;

    const timeout = setTimeout(() => {
      if (!authenticated) {
        socket.close();
        reject(new Error("WebSocket authentication timed out."));
      }
    }, 15000);

    socket.onopen = () => {
      socket.send(JSON.stringify({ type: "auth", token }));
    };

    socket.onmessage = async event => {
      let message;
      try { message = JSON.parse(event.data); }
      catch { return; }

      if (!authenticated) {
        if (
          message.type === "authenticated" ||
          message.type === "auth_ok" ||
          message.type === "ready" ||
          message.ok === true
        ) {
          authenticated = true;
          clearTimeout(timeout);
          frontButton.disabled = false;
          backButton.disabled = false;
          disconnectButton.disabled = false;
          status("Viewer authenticated. Waiting for streamer…");
          resolve();
        } else if (message.type === "error" || message.error) {
          clearTimeout(timeout);
          reject(new Error(message.error || "WebSocket authentication failed."));
        }
        return;
      }

      await handleSignal(message);
    };

    socket.onerror = () => {
      if (!authenticated) {
        clearTimeout(timeout);
        reject(new Error("Could not connect to Worker WebSocket."));
      }
    };

    socket.onclose = () => {
      if (!stopped) {
        status("Signaling connection closed. Reload to reconnect.");
        frontButton.disabled = true;
        backButton.disabled = true;
        disconnectButton.disabled = true;
      }
    };
  });
}

function createPeer() {
  if (peer) peer.close();

  peer = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" }
    ]
  });

  peer.addTransceiver("video", { direction: "recvonly" });

  peer.ontrack = event => {
    if (event.streams && event.streams[0]) {
      remoteVideo.srcObject = event.streams[0];
    } else {
      let stream = remoteVideo.srcObject;
      if (!(stream instanceof MediaStream)) {
        stream = new MediaStream();
        remoteVideo.srcObject = stream;
      }
      stream.addTrack(event.track);
    }

    remoteVideo.play().catch(() => {
      status("Stream received. Press Play if video does not start.");
    });
  };

  peer.onicecandidate = event => {
    if (event.candidate) {
      send({ type: "ice", candidate: event.candidate });
    }
  };

  peer.onconnectionstatechange = () => {
    if (!peer) return;
    if (peer.connectionState === "connected") {
      status("Connected. Live video received.");
    } else if (peer.connectionState === "failed") {
      status("Connection failed. A TURN server may be required.");
    }
  };

  return peer;
}

async function startOffer() {
  const pc = createPeer();
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  send({ type: "offer", offer: pc.localDescription });
  status("Connection offer sent. Waiting for streamer…");
}

async function handleSignal(message) {
  try {
    switch (message.type) {
      case "peer-ready":
        if (!peer) await startOffer();
        break;

      case "answer":
        if (peer) {
          await peer.setRemoteDescription(
            new RTCSessionDescription(message.answer || message)
          );
          status("Answer received. Connecting video…");
        }
        break;

      case "ice":
        if (peer && message.candidate) {
          await peer.addIceCandidate(new RTCIceCandidate(message.candidate));
        }
        break;

      case "hangup":
        closePeer();
        status("Streamer stopped the connection.");
        break;

      case "error":
        status("Worker error: " + (message.error || "Unknown error"));
        break;
    }
  } catch (error) {
    status("WebRTC error: " + error.message);
  }
}

function chooseCamera(facingMode) {
  send({ type: "set-camera", facingMode });
  status("Camera switch requested. The streamer must be active.");
}

function closePeer() {
  if (peer) {
    peer.close();
    peer = null;
  }
  remoteVideo.srcObject = null;
}

function disconnect() {
  send({ type: "hangup" });
  closePeer();
  stopped = true;
  if (socket) socket.close();
  frontButton.disabled = true;
  backButton.disabled = true;
  disconnectButton.disabled = true;
  status("Disconnected.");
}

frontButton.addEventListener("click", () => chooseCamera("user"));
backButton.addEventListener("click", () => chooseCamera("environment"));
disconnectButton.addEventListener("click", disconnect);

window.addEventListener("pagehide", () => {
  stopped = true;
  closePeer();
  if (socket) socket.close();
});

async function initialize() {
  try {
    await authenticate();
    await connectSignaling();
  } catch (error) {
    status(error.message);
  }
}

initialize();
</script>
</body>
</html>
