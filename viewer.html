
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Viewer</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  padding: 20px; background: #f3f5f8;
  font-family: Arial, sans-serif; color: #202124;
}
.card {
  width: 100%; max-width: 520px; padding: 22px;
  background: white; border: 1px solid #e1e5eb;
  border-radius: 16px; box-shadow: 0 8px 28px #00000010;
}
.header { display: flex; justify-content: space-between; align-items: center; }
h1 { font-size: 22px; margin: 0; }
.live { font-size: 12px; color: #237747; }
video {
  width: 100%; margin-top: 18px; background: #171717;
  border-radius: 10px; min-height: 180px;
}
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
button {
  padding: 10px 12px; border: 0; border-radius: 8px;
  background: #202124; color: white; cursor: pointer;
}
#status {
  margin-top: 14px; padding: 11px; border-radius: 8px;
  background: #f5f7fa; font-size: 13px; overflow-wrap: anywhere;
}
</style>
</head>
<body>
<main class="card">
  <div class="header">
    <h1>Camera Viewer</h1>
    <span class="live" id="live">● Connecting</span>
  </div>

  <video id="video" autoplay playsinline controls></video>

  <div class="controls">
    <button id="front">Front camera</button>
    <button id="back">Back camera</button>
    <button id="disconnect">Disconnect</button>
  </div>

  <div id="status" role="status" aria-live="polite">Connecting…</div>
</main>

<script>
"use strict";

const WORKER_URL = "https://private-camera-signal.thundertest987.workers.dev";
const VIEWER_SECRET = "CAMERA_VIEWER_SECRET";
const AUTH_URL = WORKER_URL + "/auth";
const SIGNAL_URL = WORKER_URL.replace(/^https:/, "wss:") + "/session";

const statusBox = document.getElementById("status");
const live = document.getElementById("live");
const video = document.getElementById("video");

let socket, peer, stopped = false;
let makingOffer = false;

function status(text) { statusBox.textContent = text; }

function send(type, data = null) {
  if (!socket || socket.readyState !== WebSocket.OPEN) return false;
  socket.send(JSON.stringify({ type, data }));
  return true;
}

async function authenticate() {
  const response = await fetch(AUTH_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ role: "viewer", secret: VIEWER_SECRET })
  });
  if (!response.ok) throw new Error("Viewer authentication failed (HTTP " + response.status + ").");
  const result = await response.json();
  if (!result.token) throw new Error("No authentication token returned.");
  return result.token;
}

function connect(token) {
  return new Promise((resolve, reject) => {
    socket = new WebSocket(SIGNAL_URL);
    let ready = false;

    const timer = setTimeout(() => {
      if (!ready) {
        reject(new Error("Signaling authentication timed out."));
        socket.close();
      }
    }, 15000);

    socket.onopen = () => socket.send(JSON.stringify({ type: "auth", token }));

    socket.onmessage = async event => {
      let message;
      try { message = JSON.parse(event.data); } catch { return; }

      if (!ready) {
        if (message.type === "ready") {
          ready = true;
          clearTimeout(timer);
          resolve();
        } else if (message.type === "error" || message.error) {
          clearTimeout(timer);
          reject(new Error(message.error || "Viewer authentication failed."));
        }
        return;
      }

      const data = message.data ?? message;
      await handleSignal({ ...data, type: message.type });
    };

    socket.onerror = () => {
      if (!ready) {
        clearTimeout(timer);
        reject(new Error("Could not connect to the Worker."));
      }
    };

    socket.onclose = () => {
      if (!stopped) {
        live.textContent = "● Disconnected";
        status("Connection closed. Reload to reconnect.");
        closePeer();
      }
    };
  });
}

function createPeer() {
  closePeer();

  peer = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });

  peer.addTransceiver("video", { direction: "recvonly" });

  peer.ontrack = event => {
    if (event.streams?.[0]) {
      video.srcObject = event.streams[0];
    } else {
      if (!video.srcObject) video.srcObject = new MediaStream();
      video.srcObject.addTrack(event.track);
    }
    video.play().catch(() => status("Video received. Press Play if needed."));
  };

  peer.onicecandidate = event => {
    if (event.candidate) send("ice", { candidate: event.candidate });
  };

  peer.onconnectionstatechange = () => {
    if (!peer) return;
    if (peer.connectionState === "connected") {
      live.textContent = "● Live";
      status("Live video connected.");
    } else if (peer.connectionState === "failed") {
      live.textContent = "● Connection failed";
      status("Connection failed. A TURN server may be required.");
    }
  };

  return peer;
}

async function makeOffer() {
  if (makingOffer) return;
  makingOffer = true;

  try {
    const pc = peer || createPeer();
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    send("offer", {
      offer: {
        type: pc.localDescription.type,
        sdp: pc.localDescription.sdp
      }
    });
    status("Offer sent. Waiting for the phone camera…");
  } catch (error) {
    status("Offer failed: " + error.message);
  } finally {
    makingOffer = false;
  }
}

async function handleSignal(message) {
  try {
    switch (message.type) {
      case "peer-ready":
        await makeOffer();
        break;

      case "answer": {
        const answer = message.answer || message;
        if (peer && answer.type === "answer" && answer.sdp) {
          await peer.setRemoteDescription(answer);
          status("Answer received. Connecting video…");
        }
        break;
      }

      case "ice":
        if (peer && message.candidate) {
          try { await peer.addIceCandidate(message.candidate); } catch {}
        }
        break;

      case "peer-left":
      case "hangup":
        closePeer();
        live.textContent = "● Waiting";
        status("Phone camera disconnected.");
        break;
    }
  } catch (error) {
    status("WebRTC error: " + error.message);
  }
}

function closePeer() {
  if (peer) {
    peer.ontrack = null;
    peer.close();
    peer = null;
  }
  video.srcObject = null;
}

function switchCamera(facingMode) {
  send("set-camera", { facingMode });
  status("Camera switch requested.");
}

function disconnect() {
  send("hangup");
  stopped = true;
  closePeer();
  socket?.close();
  live.textContent = "● Disconnected";
  status("Disconnected.");
}

document.getElementById("front").addEventListener("click", () => switchCamera("user"));
document.getElementById("back").addEventListener("click", () => switchCamera("environment"));
document.getElementById("disconnect").addEventListener("click", disconnect);

window.addEventListener("pagehide", () => {
  stopped = true;
  closePeer();
  socket?.close();
});

async function initialize() {
  try {
    live.textContent = "● Authenticating";
    const token = await authenticate();
    await connect(token);
    live.textContent = "● Connected";
    status("Authenticated. Waiting for the phone camera…");
  } catch (error) {
    live.textContent = "● Error";
    status(error.message);
  }
}

initialize();
</script>
</body>
</html>
