
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Viewer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f1f5f9;
      color: #172033;
      font-family: system-ui, Arial, sans-serif;
    }
    .card {
      width: min(720px, 100%);
      padding: 22px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 14px 40px #17203314;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    .subtitle { margin: 0 0 18px; color: #64748b; font-size: 14px; }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #0f172a;
      border-radius: 14px;
    }
    .status {
      margin: 14px 0;
      padding: 12px;
      border-radius: 12px;
      background: #f1f5f9;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 7px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .dot.active { background: #16a34a; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    button {
      flex: 1;
      min-width: 110px;
      padding: 12px 14px;
      border: 0;
      border-radius: 11px;
      background: #e2e8f0;
      color: #172033;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { background: #4f46e5; color: white; }
    button.danger { background: #fee2e2; color: #991b1b; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .note { margin: 14px 0 0; color: #64748b; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Camera Viewer</h1>
    <p class="subtitle">Connect to your phone's camera-sharing page.</p>

    <video id="remoteVideo" autoplay playsinline controls></video>

    <div class="status" role="status" aria-live="polite">
      <span id="dot" class="dot"></span>
      <span id="statusText">Connecting to signaling server…</span>
    </div>

    <div class="controls">
      <button id="frontBtn" type="button">Front camera</button>
      <button id="backBtn" type="button">Back camera</button>
      <button id="disconnectBtn" class="danger" type="button">Disconnect</button>
    </div>

    <p class="note">Keep the phone's stream page open and camera access enabled. Camera switching depends on the phone and browser supporting the requested camera.</p>
  </main>

  <script>
    "use strict";

    const WORKER_URL = "https://private-camera-signal.thunderest987.workers.dev";
    // Replace this URL with your exact deployed Worker URL if it differs.
    const VIEWER_SECRET = "CAMERA_VIEWER_SECRET";
    const ROOM = "private-camera-lab";

    const video = document.getElementById("remoteVideo");
    const statusText = document.getElementById("statusText");
    const dot = document.getElementById("dot");
    const frontBtn = document.getElementById("frontBtn");
    const backBtn = document.getElementById("backBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");

    let ws = null;
    let peer = null;
    let authToken = null;
    let reconnectTimer = null;
    let reconnectAttempts = 0;
    let manuallyDisconnected = false;
    let makingOffer = false;
    let pendingCandidates = [];

    function setStatus(text, active = false) {
      statusText.textContent = text;
      dot.classList.toggle("active", active);
    }

    async function getToken() {
      const response = await fetch(`${WORKER_URL}/auth`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: "viewer", secret: VIEWER_SECRET })
      });

      if (!response.ok) {
        throw new Error(`Authentication failed (${response.status}). Check the Worker URL and viewer secret.`);
      }

      const result = await response.json();
      if (!result.token) throw new Error("The Worker did not return an authentication token.");
      return result.token;
    }

    function send(type, data = null) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type, data }));
      } else {
        setStatus("Not connected to the signaling server.");
      }
    }

    function createPeer() {
      if (peer) {
        peer.close();
      }

      pendingCandidates = [];

      peer = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });

      peer.addTransceiver("video", { direction: "recvonly" });

      peer.ontrack = event => {
        if (event.streams && event.streams[0]) {
          video.srcObject = event.streams[0];
          video.play().catch(() => {
            setStatus("Stream received. Press play if video does not start automatically.", true);
          });
        }
      };

      peer.onicecandidate = event => {
        if (event.candidate) {
          send("ice", { candidate: event.candidate });
        }
      };

      peer.onconnectionstatechange = () => {
        if (!peer) return;

        switch (peer.connectionState) {
          case "connected":
            setStatus("Live — connected to phone camera.", true);
            break;
          case "connecting":
            setStatus("Connecting to phone camera…", true);
            break;
          case "disconnected":
            setStatus("Connection interrupted. Waiting for recovery.");
            break;
          case "failed":
            setStatus("Connection failed. Reopen the stream page and reconnect.");
            break;
          case "closed":
            setStatus("Connection closed.");
            break;
        }
      };
    }

    async function makeOffer() {
      if (!ws || ws.readyState !== WebSocket.OPEN || makingOffer) return;

      makingOffer = true;
      try {
        createPeer();
        const offer = await peer.createOffer();
        await peer.setLocalDescription(offer);

        send("offer", {
          offer: {
            type: peer.localDescription.type,
            sdp: peer.localDescription.sdp
          }
        });

        setStatus("Offer sent. Waiting for phone camera…", true);
      } catch (error) {
        console.error("Could not create offer:", error);
        setStatus(`Could not start stream: ${error.message}`);
      } finally {
        makingOffer = false;
      }
    }

    async function handleSignal(message) {
      const data = message.data ?? message;

      switch (message.type) {
        case "ready":
          setStatus("Connected to signaling server. Waiting for phone…", true);
          break;

        case "peer-ready":
          setStatus("Phone detected. Connecting to camera…", true);
          await makeOffer();
          break;

        case "answer": {
          const answer = data.answer ?? data;
          if (peer && answer.type === "answer" && answer.sdp) {
            await peer.setRemoteDescription(answer);

            for (const candidate of pendingCandidates) {
              try {
                await peer.addIceCandidate(candidate);
              } catch (error) {
                console.warn("Could not add queued ICE candidate:", error);
              }
            }
            pendingCandidates = [];
          }
          break;
        }

        case "ice":
          if (data.candidate) {
            if (peer && peer.remoteDescription) {
              try {
                await peer.addIceCandidate(data.candidate);
              } catch (error) {
                console.warn("Could not add ICE candidate:", error);
              }
            } else {
              pendingCandidates.push(data.candidate);
            }
          }
          break;

        case "camera-facing":
          setStatus(
            `Phone reports ${data.facingMode === "environment" ? "back" : "front"} camera selected.`,
            true
          );
          break;

        case "hangup":
          if (peer) {
            peer.close();
            peer = null;
          }
          video.srcObject = null;
          setStatus("Phone disconnected the stream.");
          break;

        default:
          console.log("Signaling message:", message.type);
      }
    }

    async function connect() {
      if (manuallyDisconnected) return;

      try {
        setStatus("Authenticating…");
        authToken = await getToken();

        const wsUrl = new URL(`${WORKER_URL}/session`);
        wsUrl.protocol = wsUrl.protocol === "https:" ? "wss:" : "ws:";
        wsUrl.searchParams.set("room", ROOM);

        ws = new WebSocket(wsUrl.toString());

        ws.onopen = () => {
          reconnectAttempts = 0;
          ws.send(JSON.stringify({ type: "auth", token: authToken }));
        };

        ws.onmessage = async event => {
          try {
            await handleSignal(JSON.parse(event.data));
          } catch (error) {
            console.error("Could not process signaling message:", error);
            setStatus(`Signaling error: ${error.message}`);
          }
        };

        ws.onerror = () => {
          setStatus("Signaling connection error.");
        };

        ws.onclose = () => {
          if (manuallyDisconnected) return;

          setStatus("Signaling disconnected. Reconnecting…");
          const delay = Math.min(1000 * (2 ** reconnectAttempts), 10000);
          reconnectAttempts++;
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connect, delay);
        };
      } catch (error) {
        setStatus(error.message);
        if (!manuallyDisconnected) {
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connect, 4000);
        }
      }
    }

    function requestCamera(facingMode) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        setStatus("Connect to the signaling server before switching cameras.");
        return;
      }

      send("set-camera", { facingMode });
      setStatus(`Requesting ${facingMode === "environment" ? "back" : "front"} camera…`, true);
    }

    function disconnect() {
      manuallyDisconnected = true;
      clearTimeout(reconnectTimer);

      send("hangup");

      if (ws) {
        ws.onclose = null;
        ws.close();
        ws = null;
      }

      if (peer) {
        peer.close();
        peer = null;
      }

      video.srcObject = null;
      setStatus("Disconnected. Reload this page to reconnect.");
      frontBtn.disabled = true;
      backBtn.disabled = true;
      disconnectBtn.disabled = true;
    }

    frontBtn.addEventListener("click", () => requestCamera("user"));
    backBtn.addEventListener("click", () => requestCamera("environment"));
    disconnectBtn.addEventListener("click", disconnect);

    window.addEventListener("pagehide", () => {
      clearTimeout(reconnectTimer);
      if (ws) ws.close();
      if (peer) peer.close();
    });

    connect();
  </script>
</body>
</html>
