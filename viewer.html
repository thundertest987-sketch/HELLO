
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Private Camera Viewer</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <h2>Camera Viewer — Laptop</h2>
  <p>Keep this page open while viewing. No recording is performed.</p>
  <button id="create">Create viewing session</button>
  <p id="status">No session created.</p>
  <p><a id="streamLink" hidden>Open phone streaming page</a></p>
  <video id="video" autoplay playsinline controls
         style="width:100%;max-width:800px;background:#111"></video>
  <button id="stop">Stop viewer</button>

<script>
let peer, activeCall, token;
const $ = id => document.getElementById(id);
const status = text => $("status").textContent = text;

$("create").onclick = () => {
  if (peer) peer.destroy();
  $("video").srcObject = null;
  $("streamLink").hidden = true;

  token = Array.from(crypto.getRandomValues(new Uint8Array(24)),
    b => b.toString(16).padStart(2, "0")).join("");

  status("Connecting to signaling service...");
  peer = new Peer();

  peer.on("open", id => {
    const url = new URL("stream.html", location.href);
    url.searchParams.set("viewer", id);
    url.searchParams.set("token", token);

    $("streamLink").href = url.href;
    $("streamLink").textContent =
      "Open or copy this temporary phone streaming link";
    $("streamLink").hidden = false;
    status("Ready. Open the link on your phone and tap Start Streaming.");
  });

  peer.on("call", call => {
    if (!token || call.metadata?.token !== token) {
      call.close();
      return;
    }

    if (activeCall) activeCall.close();
    activeCall = call;
    call.answer();

    call.on("stream", media => {
      if (activeCall !== call) return;
      $("video").srcObject = media;
      $("video").play().catch(() => {});
      status("Live stream connected.");
    });

    call.on("close", () => {
      if (activeCall === call) {
        activeCall = null;
        $("video").srcObject = null;
        status("Stream ended.");
      }
    });
  });

  peer.on("error", e => status("Connection error: " + e.type));
};

$("stop").onclick = () => {
  token = null;
  if (activeCall) activeCall.close();
  activeCall = null;
  if (peer) peer.destroy();
  peer = null;
  $("video").srcObject = null;
  $("streamLink").hidden = true;
  status("Viewer stopped.");
};
</script>
</body>
</html>
