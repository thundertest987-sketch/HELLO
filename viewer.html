
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Camera Viewer</title>
  <style>
    body { font: 16px system-ui; max-width: 760px; margin: 32px auto; padding: 0 16px; }
    video { width: 100%; background: #111; border-radius: 12px; }
    input, button { font: inherit; padding: 10px; margin: 6px 0; }
    #status { padding: 10px 0; }
  </style>
</head>
<body>
  <h1>Private Camera Viewer</h1>
  <p>Enter the viewer secret configured for your Worker. Do not share it.</p>
  <input id="secret" type="password" autocomplete="off"
         placeholder="Viewer secret" style="width: min(95%, 420px)">
  <button id="connect">Connect</button>
  <button id="stop" disabled>Disconnect</button>
  <p id="status" role="status">Disconnected</p>
  <video id="video" autoplay playsinline></video>

<script>
const API = "https://private-camera-signal.thundertest987.workers.dev";
const status = document.getElementById("status");
const video = document.getElementById("video");
let socket, pc;

function say(message) { status.textContent = message; }

async function connect() {
  document.getElementById("connect").disabled = true;
  const secretInput = document.getElementById("secret");
  const secret = secretInput.value;
  secretInput.value = "";

  try {
    const response = await fetch(API + "/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ role: "viewer", secret })
    });
    if (!response.ok) throw new Error("Viewer authorization failed");
    const { token } = await response.json();

    socket = new WebSocket(API.replace(/^https:/, "wss:") + "/session");
    socket.onopen = () => socket.send(JSON.stringify({ type: "auth", token }));
    socket.onmessage = async event => {
      const msg = JSON.parse(event.data);
      if (msg.type === "ready") {
        say("Authorized. Waiting for your phone.");
        document.getElementById("stop").disabled = false;
      }
      if (msg.type === "peer-ready") {
        await makeOffer();
      }
      if (msg.type === "answer" && pc) {
        await pc.setRemoteDescription(msg.data);
      }
      if (msg.type === "ice" && pc && msg.data) {
        try { await pc.addIceCandidate(msg.data); } catch {}
      }
      if (msg.type === "peer-left") say("Phone disconnected.");
      if (msg.type === "hangup") say("Phone stopped streaming.");
    };
    socket.onerror = () => say("Connection error. Check your Worker.");
    socket.onclose = () => say("Disconnected.");
  } catch (error) {
    say(error.message || "Could not connect.");
    document.getElementById("connect").disabled = false;
  }
}

async function makeOffer() {
  if (pc) pc.close();
  pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });
  pc.ontrack = event => { video.srcObject = event.streams[0]; };
  pc.onicecandidate = event => {
    if (event.candidate && socket?.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: "ice", data: event.candidate }));
    }
  };
  pc.addTransceiver("video", { direction: "recvonly" });
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.send(JSON.stringify({ type: "offer", data: pc.localDescription }));
  say("Offer sent. Waiting for phone to start streaming.");
}

function disconnect() {
  if (socket?.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "hangup" }));
    socket.close();
  }
  if (pc) pc.close();
  pc = null;
  socket = null;
  video.srcObject = null;
  document.getElementById("connect").disabled = false;
  document.getElementById("stop").disabled = true;
  say("Disconnected.");
}

document.getElementById("connect").onclick = connect;
document.getElementById("stop").onclick = disconnect;
</script>
</body>
</html>
