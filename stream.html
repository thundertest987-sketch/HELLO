
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Streamer</title>
  <style>
    body {
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #111;
    }

    #status {
      padding: 15px;
      margin-top: 20px;
      border-radius: 8px;
      background: #eef3f8;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>Camera Streamer</h1>
  <p>
    Authentication and camera startup run automatically.
    The camera turns off when this page is closed.
  </p>

  <div id="status" role="status" aria-live="polite">
    Initializing…
  </div>

<script>
"use strict";

const WORKER_URL =
  "https://private-camera-signal.thundertest987.workers.dev";

const PHONE_SECRET = "CAMERA_PHONE_SECRET";
const AUTH_URL = WORKER_URL + "/auth";
const SIGNAL_URL = WORKER_URL.replace(/^https:/, "wss:") + "/session";

const ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" }
];

const statusBox = document.getElementById("status");

let token = null;
let socket = null;
let peer = null;
let localStream = null;
let pendingOffer = null;
let started = false;
let stopped = false;
let facingMode = "user";
let authTimer = null;

function status(message) {
  statusBox.textContent = message;
}

function send(message) {
  if (!socket || socket.readyState !== WebSocket.OPEN) {
    status("Signaling connection is not ready.");
    return false;
  }

  socket.send(JSON.stringify(message));
  return true;
}

async function authenticate() {
  status("Authenticating streamer…");

  const response = await fetch(AUTH_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      role: "phone",
      secret: PHONE_SECRET
    })
  });

  if (!response.ok) {
    throw new Error("Authentication failed: HTTP " + response.status);
  }

  const data = await response.json();

  if (!data.token) {
    throw new Error("The Worker did not return a token.");
  }

  token = data.token;
}

function connectSignaling() {
  return new Promise((resolve, reject) => {
    socket = new WebSocket(SIGNAL_URL);

    let authenticated = false;
    let settled = false;

    function fail(error) {
      if (settled) return;
      settled = true;
      clearTimeout(authTimer);
      reject(error);
    }

    authTimer = setTimeout(() => {
      if (!authenticated) {
        fail(new Error("WebSocket authentication timed out."));
        socket.close();
      }
    }, 15000);

    socket.onopen = () => {
      socket.send(JSON.stringify({ type: "auth", token }));
    };

    socket.onmessage = async event => {
      let message;

      try {
        message = JSON.parse(event.data);
      } catch {
        status("Received an invalid signaling message.");
        return;
      }

      if (!authenticated) {
        if (
          message.type === "ready" ||
          message.type === "authenticated" ||
          message.type === "auth_ok" ||
          message.ok === true
        ) {
          authenticated = true;
          settled = true;
          clearTimeout(authTimer);
          status("Authenticated. Starting camera…");
          resolve();
          return;
        }

        if (message.type === "error" || message.error) {
          fail(new Error(message.error || "WebSocket authentication failed."));
        }

        return;
      }

      await handleSignal(message);
    };

    socket.onerror = () => {
      if (!authenticated) {
        fail(new Error("Could not connect to the Worker."));
      }
    };

    socket.onclose = () => {
      clearTimeout(authTimer);

      if (!stopped) {
        stopCamera();
        closePeer();
        status("Signaling connection closed. Reload this page to reconnect.");
      }
    };
  });
}

function createPeer() {
  closePeer();

  peer = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  peer.onicecandidate = event => {
    if (event.candidate) {
      send({
        type: "ice",
        candidate: event.candidate
      });
    }
  };

  peer.onconnectionstatechange = () => {
    if (!peer) return;

    if (peer.connectionState === "connected") {
      status("Connected. Live video is being sent to the viewer.");
    } else if (peer.connectionState === "failed") {
      status("WebRTC connection failed. A TURN server may be needed.");
    } else if (peer.connectionState === "disconnected") {
      status("Viewer connection interrupted.");
    }
  };

  return peer;
}

async function startCamera() {
  if (started || !token) return;

  status("Requesting camera permission…");

  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Camera access is unavailable in this browser.");
    }

    localStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    started = true;

    if (pendingOffer) {
      const offer = pendingOffer;
      pendingOffer = null;
      await answerOffer(offer);
    } else {
      status("Camera is active. Waiting for the viewer to connect…");
    }
  } catch (error) {
    stopCamera();
    status("Camera could not start: " + error.message);
  }
}

function extractOffer(message) {
  const candidates = [
    message?.offer,
    message?.description,
    message?.data?.offer,
    message?.payload?.offer,
    message
  ];

  for (const candidate of candidates) {
    if (
      candidate &&
      candidate.type === "offer" &&
      typeof candidate.sdp === "string" &&
      candidate.sdp.startsWith("v=")
    ) {
      return {
        type: "offer",
        sdp: candidate.sdp
      };
    }
  }

  return null;
}

async function answerOffer(message) {
  const offer = extractOffer(message);

  if (!offer) {
    console.error("Invalid WebRTC offer:", message);
    status("Invalid offer received from the viewer.");
    return;
  }

  if (!localStream) {
    pendingOffer = offer;
    status("Viewer is ready. Waiting for camera access…");
    return;
  }

  try {
    const pc = peer || createPeer();

    for (const track of localStream.getTracks()) {
      if (!pc.getSenders().some(sender => sender.track === track)) {
        pc.addTrack(track, localStream);
      }
    }

    await pc.setRemoteDescription(offer);

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    send({
      type: "answer",
      answer: {
        type: pc.localDescription.type,
        sdp: pc.localDescription.sdp
      }
    });

    status("Answer sent. Establishing live video…");
  } catch (error) {
    console.error("Offer processing failed:", error);
    status("WebRTC error: " + error.message);
  }
}

async function switchCamera(mode) {
  if (!["user", "environment"].includes(mode)) return;

  facingMode = mode;

  if (!started || !localStream) {
    status("Camera preference saved for startup.");
    return;
  }

  let replacementStream;

  try {
    replacementStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    const newTrack = replacementStream.getVideoTracks()[0];

    if (!newTrack) {
      throw new Error("No video track found.");
    }

    if (peer) {
      const sender = peer.getSenders().find(
        item => item.track?.kind === "video"
      );

      if (sender) {
        await sender.replaceTrack(newTrack);
      }
    }

    const oldStream = localStream;
    localStream = replacementStream;

    oldStream.getTracks().forEach(track => track.stop());

    status(
      "Switched to " +
      (mode === "user" ? "front" : "back") +
      " camera."
    );
  } catch (error) {
    if (replacementStream) {
      replacementStream.getTracks().forEach(track => track.stop());
    }

    status("Camera switch failed: " + error.message);
  }
}

async function handleSignal(message) {
  try {
    switch (message.type) {
      case "offer":
        await answerOffer(message);
        break;

      case "ice":
        if (peer && message.candidate) {
          await peer.addIceCandidate(
            new RTCIceCandidate(message.candidate)
          );
        }
        break;

      case "set-camera":
      case "camera-facing":
        await switchCamera(message.facingMode || message.camera);
        break;

      case "peer-ready":
        status("Viewer connected. Waiting for its WebRTC offer…");
        break;

      case "hangup":
        closePeer();
        status("Viewer disconnected. Camera remains active.");
        break;

      case "peer-left":
        closePeer();
        status("Viewer left. Waiting for another connection…");
        break;

      case "error":
        status("Worker error: " + (message.error || "Unknown error"));
        break;
    }
  } catch (error) {
    console.error("Signaling error:", error);
    status("Signaling error: " + error.message);
  }
}

function stopCamera() {
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }

  started = false;
}

function closePeer() {
  if (peer) {
    peer.onicecandidate = null;
    peer.onconnectionstatechange = null;
    peer.close();
    peer = null;
  }
}

window.addEventListener("pagehide", () => {
  stopped = true;
  closePeer();
  stopCamera();

  if (socket) {
    socket.close();
  }
});

async function initialize() {
  try {
    await authenticate();
    await connectSignaling();
    await startCamera();
  } catch (error) {
    console.error(error);
    status(error.message);
  }
}

initialize();
</script>
</body>
</html>
