
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello...</title>
  <style>
    body {
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 0;
      border-radius: 6px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { background: #ddd; color: #888; }
    #status {
      padding: 15px;
      margin-top: 20px;
      border-radius: 8px;
      background: #eef3f8;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>Hello...</h1>
  <p>Authentication runs automatically. The camera remains off until you start streaming.</p>

  <button id="start" disabled>Start Streaming</button>
  <button id="stop" disabled>Stop Streaming</button>
  <div id="status">Authenticating…</div>

<script>
"use strict";

const WORKER_URL =
  "https://private-camera-signal.thundertest987.workers.dev";
const PHONE_SECRET = "CAMERA_PHONE_SECRET";
const AUTH_URL = WORKER_URL + "/auth";
const SIGNAL_URL = WORKER_URL.replace(/^https:/, "wss:") + "/session";

let token = null;
let socket = null;
let peer = null;
let localStream = null;
let pendingOffer = null;
let started = false;
let stopped = false;
let facingMode = "user";

const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");
const statusBox = document.getElementById("status");

function status(message) {
  statusBox.textContent = message;
}

function send(message) {
  if (!socket || socket.readyState !== WebSocket.OPEN) {
    status("Signaling connection is not ready.");
    return false;
  }
  socket.send(JSON.stringify(message));
  return true;
}

async function authenticate() {
  const response = await fetch(AUTH_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      role: "phone",
      secret: PHONE_SECRET
    })
  });

  if (!response.ok) {
    throw new Error("Phone authentication failed: HTTP " + response.status);
  }

  const data = await response.json();
  if (!data.token) throw new Error("No token returned by Worker.");
  token = data.token;
}

function connectSignaling() {
  return new Promise((resolve, reject) => {
    socket = new WebSocket(SIGNAL_URL);
    let authenticated = false;

    const timeout = setTimeout(() => {
      if (!authenticated) {
        socket.close();
        reject(new Error("WebSocket authentication timed out."));
      }
    }, 15000);

    socket.onopen = () => {
      socket.send(JSON.stringify({ type: "auth", token }));
    };

    socket.onmessage = async event => {
      let message;
      try { message = JSON.parse(event.data); }
      catch { return; }

      if (!authenticated) {
        if (
          message.type === "authenticated" ||
          message.type === "auth_ok" ||
          message.type === "ready" ||
          message.ok === true
        ) {
          authenticated = true;
          clearTimeout(timeout);
          startButton.disabled = false;
          status("Authenticated. Tap Start Streaming to turn on the camera.");
          resolve();
        } else if (message.type === "error" || message.error) {
          clearTimeout(timeout);
          reject(new Error(message.error || "WebSocket authentication failed."));
        }
        return;
      }

      await handleSignal(message);
    };

    socket.onerror = () => {
      if (!authenticated) {
        clearTimeout(timeout);
        reject(new Error("Could not connect to Worker WebSocket."));
      }
    };

    socket.onclose = () => {
      if (!stopped) {
        startButton.disabled = true;
        status("Signaling connection closed. Reload the page to reconnect.");
      }
    };
  });
}

function createPeer() {
  if (peer) peer.close();

  peer = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" }
    ]
  });

  peer.onicecandidate = event => {
    if (event.candidate) {
      send({ type: "ice", candidate: event.candidate });
    }
  };

  peer.onconnectionstatechange = () => {
    if (!peer) return;
    if (peer.connectionState === "connected") {
      status("Streaming connection established.");
    } else if (peer.connectionState === "failed") {
      status("Connection failed. Your network may require a TURN server.");
    }
  };

  return peer;
}

async function startCamera() {
  if (started) return;

  startButton.disabled = true;
  status("Requesting camera permission…");

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    started = true;
    stopButton.disabled = false;

    if (pendingOffer) {
      const offer = pendingOffer;
      pendingOffer = null;
      await answerOffer(offer);
    } else {
      status("Camera is on. Waiting for viewer connection…");
    }
  } catch (error) {
    stopTracks();
    startButton.disabled = false;
    status("Camera error: " + error.message);
  }
}

async function answerOffer(offer) {
  if (!localStream) {
    pendingOffer = offer;
    status("Viewer is ready. Tap Start Streaming to continue.");
    return;
  }

  const pc = peer || createPeer();

  for (const track of localStream.getTracks()) {
    if (!pc.getSenders().some(sender => sender.track === track)) {
      pc.addTrack(track, localStream);
    }
  }

  await pc.setRemoteDescription(new RTCSessionDescription(offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  send({ type: "answer", answer: pc.localDescription });
  status("Camera is on. Connecting to viewer…");
}

async function switchCamera(mode) {
  if (!["user", "environment"].includes(mode)) return;
  facingMode = mode;

  if (!started || !localStream) {
    status("Camera preference saved for when streaming starts.");
    return;
  }

  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: facingMode } }
    });

    const newTrack = newStream.getVideoTracks()[0];
    const oldStream = localStream;
    localStream = newStream;

    if (peer) {
      const sender = peer.getSenders().find(
        item => item.track && item.track.kind === "video"
      );

      if (sender) await sender.replaceTrack(newTrack);
      else peer.addTrack(newTrack, newStream);
    }

    oldStream.getTracks().forEach(track => track.stop());
    status("Switched camera.");
  } catch (error) {
    status("Camera switch failed: " + error.message);
  }
}

async function handleSignal(message) {
  try {
    switch (message.type) {
      case "offer":
        await answerOffer(message.offer || message);
        break;

      case "ice":
        if (peer && message.candidate) {
          await peer.addIceCandidate(new RTCIceCandidate(message.candidate));
        }
        break;

      case "set-camera":
      case "camera-facing":
        await switchCamera(message.facingMode || message.camera);
        break;

      case "peer-ready":
        status("Viewer is ready.");
        break;

      case "hangup":
        closePeer();
        status("Viewer disconnected.");
        break;

      case "error":
        status("Worker error: " + (message.error || "Unknown error"));
        break;
    }
  } catch (error) {
    status("Connection error: " + error.message);
  }
}

function stopTracks() {
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }
}

function closePeer() {
  if (peer) {
    peer.close();
    peer = null;
  }
}

function stopStreaming() {
  send({ type: "hangup" });
  closePeer();
  stopTracks();
  started = false;
  pendingOffer = null;
  stopButton.disabled = true;
  startButton.disabled = !socket || socket.readyState !== WebSocket.OPEN;
  status("Streaming stopped. Camera is off.");
}

startButton.addEventListener("click", startCamera);
stopButton.addEventListener("click", stopStreaming);

window.addEventListener("pagehide", () => {
  stopped = true;
  closePeer();
  stopTracks();
  if (socket) socket.close();
});

async function initialize() {
  try {
    await authenticate();
    await connectSignaling();
  } catch (error) {
    status(error.message);
  }
}

initialize();
</script>
</body>
</html>
