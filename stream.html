
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Private Camera Stream</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <h2>Camera Stream — Phone</h2>
  <p>Live-only test. No recording or uploading by this page.</p>
  <p id="status">Camera is off.</p>
  <button id="start">Start Streaming</button>
  <button id="stop">Stop Streaming</button>

<script>
let peer, stream, call;
const $ = id => document.getElementById(id);
const status = text => $("status").textContent = text;
const params = new URLSearchParams(location.search);
const viewerId = params.get("viewer");
const token = params.get("token");

function stop() {
  if (call) call.close();
  call = null;

  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;

  if (peer) peer.destroy();
  peer = null;
  status("Streaming stopped; camera tracks released.");
}

$("start").onclick = async () => {
  if (stream) return;

  if (!viewerId || !token || !/^[a-f0-9]{48}$/.test(token)) {
    status("Invalid session link. Create a new session on the laptop.");
    return;
  }

  try {
    status("Requesting camera permission...");
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    status("Camera active. Connecting to viewer...");
    peer = new Peer();

    peer.on("open", () => {
      if (!stream) return;

      call = peer.call(viewerId, stream, {
        metadata: { token }
      });

      if (!call) {
        stop();
        status("Could not connect. Try creating a new viewer session.");
        return;
      }

      call.on("close", stop);
      call.on("error", () => {
        status("Connection failed. Stop and try again.");
      });

      status("Camera active; connecting to laptop...");
    });

    peer.on("error", e => {
      status("Connection error: " + e.type);
      stop();
    });
  } catch (e) {
    status("Camera access failed: " + e.name);
    stop();
  }
};

$("stop").onclick = stop;
window.addEventListener("pagehide", stop);
</script>
</body>
</html>
