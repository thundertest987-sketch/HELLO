
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Camera Stream</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font: 16px Arial, sans-serif; max-width: 650px; margin: 30px auto; padding: 16px; }
    input, button { box-sizing: border-box; padding: 12px; margin: 6px 0; max-width: 100%; }
    input { width: 100%; }
  </style>
</head>
<body>
  <h2>Camera Stream — OnePlus</h2>
  <p>Live-only session. No recording or uploading by this page.</p>

  <label for="viewerId">Laptop viewer ID</label>
  <input id="viewerId" autocomplete="off" placeholder="Enter viewer ID">

  <label for="pairCode">One-time pairing code</label>
  <input id="pairCode" autocomplete="off" placeholder="Enter pairing code">

  <p id="status">Camera is off.</p>

  <button id="start">Start Streaming</button>
  <button id="switch" disabled>Switch Front / Rear Camera</button>
  <button id="stop" disabled>Stop Streaming</button>

<script>
(() => {
  let peer = null;
  let stream = null;
  let call = null;
  let facing = "environment";
  let stopping = false;

  const $ = id => document.getElementById(id);
  const setStatus = message => $("status").textContent = message;

  function stopStreaming(message = "Streaming stopped; camera released.") {
    stopping = true;

    if (call) {
      const oldCall = call;
      call = null;
      oldCall.close();
    }

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    if (peer) {
      const oldPeer = peer;
      peer = null;
      oldPeer.destroy();
    }

    $("start").disabled = false;
    $("switch").disabled = true;
    $("stop").disabled = true;
    setStatus(message);
  }

  async function switchCamera() {
    if (!stream || !call) return;

    const nextFacing =
      facing === "environment" ? "user" : "environment";

    let nextStream;

    try {
      nextStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: nextFacing },
        audio: false
      });

      const nextTrack = nextStream.getVideoTracks()[0];
      const sender = call.peerConnection
        .getSenders()
        .find(s => s.track && s.track.kind === "video");

      if (!sender) throw new Error("Video sender not found");

      await sender.replaceTrack(nextTrack);

      stream.getTracks().forEach(track => track.stop());
      stream = nextStream;
      facing = nextFacing;

      setStatus(facing === "user"
        ? "Streaming from front camera."
        : "Streaming from rear camera.");
    } catch (error) {
      if (nextStream) nextStream.getTracks().forEach(t => t.stop());
      setStatus("Camera switch failed: " + error.name);
    }
  }

  $("start").onclick = async () => {
    if (stream) return;

    const viewerId = $("viewerId").value.trim();
    const token = $("pairCode").value.trim();

    if (!viewerId || !/^[a-f0-9]{32}$/.test(token)) {
      setStatus("Enter a valid viewer ID and 32-character pairing code.");
      return;
    }

    stopping = false;
    $("start").disabled = true;
    setStatus("Requesting camera permission...");

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing },
        audio: false
      });

      setStatus("Camera active. Connecting to laptop...");
      peer = new Peer();

      peer.on("open", () => {
        if (stopping || !stream) return;

        call = peer.call(viewerId, stream, {
          metadata: { token }
        });

        if (!call) {
          stopStreaming("Could not initiate connection.");
          return;
        }

        call.on("close", () => {
          if (!stopping) {
            stopStreaming("Viewer disconnected; camera released.");
          }
        });

        call.on("error", () => {
          stopStreaming("Connection failed; camera released.");
        });

        $("switch").disabled = false;
        $("stop").disabled = false;
        setStatus("Camera active; attempting to connect.");
      });

      peer.on("error", error => {
        if (!stopping) {
          stopStreaming("Connection error: " + error.type);
        }
      });
    } catch (error) {
      stopStreaming("Camera access failed: " + error.name);
    }
  };

  $("switch").onclick = switchCamera;
  $("stop").onclick = () => stopStreaming();

  window.addEventListener("pagehide", () => {
    stopStreaming("Page closed; camera released.");
  });
})();
</script>
</body>
</html>
