
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello..</title>
  <style>
    body {
      max-width: 850px;
      margin: 45px auto;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #111;
    }
    button {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      border: 0;
      border-radius: 6px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      background: #ddd;
      color: #888;
      cursor: not-allowed;
    }
    #status {
      padding: 15px;
      margin-top: 20px;
      background: #eef3f8;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>Hello..</h1>
  <p>Authentication runs automatically. Your camera remains off until you start streaming.</p>

  <button id="start" disabled>Start Streaming</button>
  <button id="stop" disabled>Stop Streaming</button>

  <div id="status" role="status" aria-live="polite">
    Connecting to authentication service…
  </div>

<script>
"use strict";

const WORKER_URL =
  "https://private-camera-signal.thundertest987.workers.dev";
const AUTH_URL = WORKER_URL + "/auth";
const SIGNAL_URL = WORKER_URL.replace(/^https:/, "wss:") + "/session";

/* Use a disposable lab credential; never reuse a real secret here. */
const PHONE_SECRET = "CAMERA_PHONE_SECRET";

const ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" }
];

const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");
const statusBox = document.getElementById("status");

let token = null;
let socket = null;
let peer = null;
let localStream = null;
let facingMode = "user";
let pendingOffer = null;
let started = false;
let stopped = false;

function status(text) {
  statusBox.textContent = text;
}

function send(message) {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify(message));
}

async function authenticate() {
  if (
    !PHONE_SECRET.trim() ||
    PHONE_SECRET === "CAMERA_PHONE_SECRET"
  ) {
    throw new Error("Configure the disposable phone credential in stream.html.");
  }

  const response = await fetch(AUTH_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      role: "phone",
      secret: PHONE_SECRET
    })
  });

  if (!response.ok) {
    throw new Error("Phone authentication failed: HTTP " + response.status);
  }

  const data = await response.json();
  if (!data.token) throw new Error("No authentication token was returned.");
  token = data.token;
}

function connectSignaling() {
  return new Promise((resolve, reject) => {
    socket = new WebSocket(SIGNAL_URL);
    let authenticated = false;

    const timeout = setTimeout(() => {
      if (!authenticated) {
        reject(new Error("Signaling authentication timed out."));
        socket.close();
      }
    }, 15000);

    socket.onopen = () => {
      socket.send(JSON.stringify({ type: "auth", token }));
    };

    socket.onmessage = async event => {
      let message;
      try {
        message = JSON.parse(event.data);
      } catch {
        return;
      }

      if (!authenticated) {
        if (
          message.type === "authenticated" ||
          message.type === "auth_ok" ||
          message.type === "ready" ||
          message.ok === true
        ) {
          authenticated = true;
          clearTimeout(timeout);
          startButton.disabled = false;
          status("Authenticated. Tap Start Streaming to enable the camera.");
          resolve();
        } else if (message.type === "error" || message.error) {
          clearTimeout(timeout);
          reject(new Error(message.error || "WebSocket authentication failed."));
        }
        return;
      }

      await handleSignal(message);
    };

    socket.onerror = () => {
      if (!authenticated) {
        clearTimeout(timeout);
        reject(new Error("Could not connect to the signaling service."));
      }
    };

    socket.onclose = () => {
      if (!stopped) {
        startButton.disabled = true;
        status("Signaling connection closed. Reload this page to reconnect.");
      }
    };
  });
}

function createPeer() {
  if (peer) peer.close();

  peer = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  peer.onicecandidate = event => {
    if (event.candidate) {
      send({ type: "ice", candidate: event.candidate });
    }
  };

  peer.onconnectionstatechange = () => {
    if (!peer) return;
    if (peer.connectionState === "connected") {
      status("Streaming to viewer.");
    } else if (peer.connectionState === "failed") {
      status("Connection failed. Your network may require a TURN server.");
    }
  };

  return peer;
}

async function startCamera() {
  if (started) return;

  startButton.disabled = true;
  status("Requesting camera permission…");

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    started = true;
    stopButton.disabled = false;

    if (pendingOffer) {
      const offer = pendingOffer;
      pendingOffer = null;
      await answerOffer(offer);
    } else {
      status("Camera is on. Waiting for the viewer to connect…");
    }
  } catch (error) {
    stopTracks();
    status("Could not start camera: " + error.message);
    startButton.disabled = false;
  }
}

async function answerOffer(offer) {
  if (!localStream) {
    pendingOffer = offer;
    status("Viewer is ready. Tap Start Streaming to continue.");
    return;
  }

  const pc = peer || createPeer();

  for (const track of localStream.getTracks()) {
    if (!pc.getSenders().some(sender => sender.track === track)) {
      pc.addTrack(track, localStream);
    }
  }

  await pc.setRemoteDescription(new RTCSessionDescription(offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  send({ type: "answer", answer: pc.localDescription });
  status("Camera is on. Connecting to viewer…");
}

async function switchCamera(requestedMode) {
  if (!["user", "environment"].includes(requestedMode)) return;

  facingMode = requestedMode;

  /* Remember the requested camera if streaming hasn't started yet. */
  if (!started || !localStream) {
    status(
      "Camera preference updated to " +
      (facingMode === "user" ? "front" : "back") +
      ". Start streaming to apply it."
    );
    return;
  }

  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    const newTrack = newStream.getVideoTracks()[0];
    const oldStream = localStream;
    localStream = newStream;

    if (peer) {
      const sender = peer.getSenders().find(
        item => item.track && item.track.kind === "video"
      );

      if (sender) {
        await sender.replaceTrack(newTrack);
      } else {
        peer.addTrack(newTrack, newStream);
      }
    }

    oldStream.getTracks().forEach(track => track.stop());
    status("Switched to the " +
      (facingMode === "user" ? "front" : "back") + " camera.");
  } catch (error) {
    status("Camera switch failed: " + error.message);
  }
}

async function handleSignal(message) {
  try {
    switch (message.type) {
      case "offer":
        await answerOffer(message.offer || message);
        break;

      case "ice":
        if (peer && message.candidate) {
          await peer.addIceCandidate(
            new RTCIceCandidate(message.candidate)
          );
        }
        break;

      case "set-camera":
      case "camera-facing":
        await switchCamera(message.facingMode || message.camera);
        break;

      case "hangup":
        closePeer();
        status("Viewer disconnected.");
        break;

      case "peer-ready":
        status(started
          ? "Viewer is ready. Waiting for the connection offer…"
          : "Viewer is ready. Tap Start Streaming when you want to begin.");
        break;

      case "error":
        status("Signaling error: " + (message.error || "Unknown error"));
        break;
    }
  } catch (error) {
    status("Connection error: " + error.message);
  }
}

function stopTracks() {
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }
}

function closePeer() {
  if (peer) {
    peer.onicecandidate = null;
    peer.close();
    peer = null;
  }
}

function stopStreaming() {
  send({ type: "hangup" });
  closePeer();
  stopTracks();

  started = false;
  pendingOffer = null;
  stopButton.disabled = true;
  startButton.disabled = !socket || socket.readyState !== WebSocket.OPEN;
  status("Streaming stopped. Camera is off.");
}

startButton.addEventListener("click", startCamera);
stopButton.addEventListener("click", stopStreaming);

window.addEventListener("pagehide", () => {
  stopped = true;
  closePeer();
  stopTracks();
  if (socket) socket.close();
});

async function initialize() {
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Camera access is unavailable in this browser.");
    }
    await authenticate();
    await connectSignaling();
  } catch (error) {
    status(error.message);
    startButton.disabled = true;
  }
}

initialize();
</script>
</body>
</html>
