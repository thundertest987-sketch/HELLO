
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Camera Stream</title>
  <style>
    body { font: 16px system-ui; max-width: 760px; margin: 32px auto; padding: 0 16px; }
    video { width: 100%; background: #111; border-radius: 12px; }
    input, button, select { font: inherit; padding: 10px; margin: 6px 0; }
    #status { padding: 10px 0; }
  </style>
</head>
<body>
  <h1>Private Camera Stream</h1>
  <p>Your camera stays off until you tap Start Streaming.</p>

  <input id="secret" type="password" autocomplete="off"
         placeholder="Phone secret" style="width: min(95%, 420px)">
  <br>
  <label for="camera">Camera:</label>
  <select id="camera">
    <option value="environment">Rear camera</option>
    <option value="user">Front camera</option>
  </select>
  <br>
  <button id="start">Start Streaming</button>
  <button id="switch" disabled>Switch Camera</button>
  <button id="stop" disabled>Stop</button>

  <p id="status" role="status">Not streaming.</p>
  <video id="preview" autoplay playsinline muted></video>

<script>
const API = "https://private-camera-signal.thundertest987.workers.dev";
const status = document.getElementById("status");
const preview = document.getElementById("preview");

let socket = null;
let pc = null;
let stream = null;
let started = false;
let pendingCandidates = [];

function say(message) { status.textContent = message; }

function send(type, data = null) {
  if (socket?.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type, data }));
  }
}

async function startStreaming() {
  if (started) return;
  started = true;
  document.getElementById("start").disabled = true;

  const input = document.getElementById("secret");
  const secret = input.value;
  input.value = "";

  try {
    const response = await fetch(API + "/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ role: "phone", secret })
    });
    if (!response.ok) throw new Error("Phone authorization failed");
    const { token } = await response.json();

    socket = new WebSocket(API.replace(/^https:/, "wss:") + "/session");

    socket.onopen = () => {
      socket.send(JSON.stringify({ type: "auth", token }));
    };

    socket.onmessage = async event => {
      const msg = JSON.parse(event.data);

      if (msg.type === "ready") {
        say("Authorized. Waiting for the laptop viewer.");
      }

      if (msg.type === "peer-ready" && msg.role === "viewer") {
        say("Laptop connected. Preparing camera...");
      }

      if (msg.type === "offer") {
        try {
          await answerOffer(msg.data);
        } catch (error) {
          say("Could not establish video: " + error.message);
        }
      }

      if (msg.type === "ice" && msg.data && pc) {
        try {
          if (pc.remoteDescription) {
            await pc.addIceCandidate(msg.data);
          } else {
            pendingCandidates.push(msg.data);
          }
        } catch {}
      }

      if (msg.type === "hangup" || msg.type === "peer-left") {
        say("Laptop disconnected. Stop and restart to reconnect.");
      }
    };

    socket.onerror = () => say("Connection error. Check the Worker.");
    socket.onclose = () => {
      if (started) say("Signaling connection closed. Stop and restart.");
    };
  } catch (error) {
    say(error.message || "Could not start.");
    cleanup();
  }
}

async function answerOffer(offer) {
  // Ask for camera access only after Start Streaming was tapped.
  if (!started) return;

  if (!stream) {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: document.getElementById("camera").value },
      audio: false
    });
    preview.srcObject = stream;
  }

  if (pc) pc.close();

  pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });

  for (const track of stream.getTracks()) {
    pc.addTrack(track, stream);
  }

  pc.onicecandidate = event => {
    if (event.candidate) send("ice", event.candidate);
  };

  await pc.setRemoteDescription(offer);

  for (const candidate of pendingCandidates) {
    try { await pc.addIceCandidate(candidate); } catch {}
  }
  pendingCandidates = [];

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  send("answer", pc.localDescription);

  document.getElementById("stop").disabled = false;
  document.getElementById("switch").disabled = false;
  say("Streaming is active. Keep this page open to maintain the connection.");
}

async function switchCamera() {
  if (!started || !stream || !pc) return;

  const select = document.getElementById("camera");
  select.value = select.value === "environment" ? "user" : "environment";

  try {
    const next = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: select.value },
      audio: false
    });

    const newTrack = next.getVideoTracks()[0];
    const sender = pc.getSenders().find(s => s.track?.kind === "video");

    if (sender) await sender.replaceTrack(newTrack);

    for (const track of stream.getTracks()) track.stop();
    stream = next;
    preview.srcObject = stream;
  } catch (error) {
    say("Unable to switch camera: " + error.message);
  }
}

function cleanup() {
  started = false;

  if (socket?.readyState === WebSocket.OPEN) {
    send("hangup");
    socket.close();
  }
  if (pc) pc.close();
  if (stream) stream.getTracks().forEach(track => track.stop());

  socket = null;
  pc = null;
  stream = null;
  pendingCandidates = [];
  preview.srcObject = null;

  document.getElementById("start").disabled = false;
  document.getElementById("switch").disabled = true;
  document.getElementById("stop").disabled = true;
  say("Stopped. Camera tracks released.");
}

document.getElementById("start").addEventListener("click", startStreaming);
document.getElementById("switch").addEventListener("click", switchCamera);
document.getElementById("stop").addEventListener("click", cleanup);
</script>
</body>
</html>
