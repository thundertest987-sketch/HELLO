
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: #172033;
      font-family: system-ui, Arial, sans-serif;
    }
    .card {
      width: min(440px, 100%);
      padding: 32px 24px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 16px 50px #17203318;
      text-align: center;
    }
    .icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: #e0e7ff;
      font-size: 32px;
    }
    h1 { margin: 0 0 10px; font-size: 27px; }
    p { color: #64748b; line-height: 1.6; }
    .status {
      margin-top: 24px;
      padding: 14px;
      border-radius: 14px;
      background: #f1f5f9;
      color: #334155;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 7px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .dot.active { background: #16a34a; }
    .note { font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">👋</div>
    <h1>Welcome!</h1>
    <p>Your camera-sharing test page is open. Keep this page open while using the viewer on your laptop.</p>

    <div class="status" role="status" aria-live="polite">
      <span id="dot" class="dot"></span>
      <span id="statusText">Connecting…</span>
    </div>

    <p class="note">Camera access requires your permission. The camera remains active only while this page keeps its camera stream running.</p>
  </main>

  <script>
    "use strict";

    const WORKER_URL = "https://private-camera-signal.thunderest987.workers.dev";
    // Replace this URL with your exact deployed Worker URL if it differs.
    const PHONE_SECRET = "CAMERA_PHONE_SECRET";
    const ROOM = "private-camera-lab";

    const statusText = document.getElementById("statusText");
    const dot = document.getElementById("dot");

    let ws = null;
    let localStream = null;
    let peer = null;
    let authToken = null;
    let reconnectTimer = null;
    let stopped = false;
    let currentFacingMode = "user";

    function setStatus(text, active = false) {
      statusText.textContent = text;
      dot.classList.toggle("active", active);
    }

    async function getToken() {
      const response = await fetch(`${WORKER_URL}/auth`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: "phone", secret: PHONE_SECRET })
      });

      if (!response.ok) {
        throw new Error(`Authentication failed (${response.status}). Check the Worker URL and phone secret.`);
      }

      const result = await response.json();
      if (!result.token) throw new Error("The Worker did not return an authentication token.");
      return result.token;
    }

    async function startCamera(facingMode = currentFacingMode) {
      const newStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });

      const newTrack = newStream.getVideoTracks()[0];
      if (!newTrack) {
        newStream.getTracks().forEach(track => track.stop());
        throw new Error("No video track was provided by the camera.");
      }

      const oldStream = localStream;
      localStream = newStream;
      currentFacingMode = facingMode;

      if (peer) {
        const sender = peer.getSenders().find(s => s.track && s.track.kind === "video");
        if (sender) {
          try {
            await sender.replaceTrack(newTrack);
          } catch (error) {
            console.error("Could not replace the video track:", error);
          }
        }
      }

      if (oldStream) oldStream.getTracks().forEach(track => track.stop());

      setStatus(`Camera active (${facingMode === "environment" ? "back" : "front"}). Waiting for viewer…`, true);
    }

    function send(type, data = null) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type, data }));
      }
    }

    function createPeer() {
      if (peer) {
        peer.close();
      }

      peer = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });

      if (localStream) {
        localStream.getTracks().forEach(track => {
          peer.addTrack(track, localStream);
        });
      }

      peer.onicecandidate = event => {
        if (event.candidate) send("ice", { candidate: event.candidate });
      };

      peer.onconnectionstatechange = () => {
        if (!peer) return;
        if (peer.connectionState === "connected") {
          setStatus("Camera active — connected to viewer.", true);
        } else if (peer.connectionState === "failed") {
          setStatus("Connection failed. Waiting for a new connection.", true);
        } else if (peer.connectionState === "disconnected") {
          setStatus("Viewer disconnected. Camera is still active.", true);
        }
      };
    }

    async function handleOffer(offer) {
      if (!offer || offer.type !== "offer" || !offer.sdp) {
        console.warn("Received an invalid offer.");
        return;
      }

      createPeer();
      await peer.setRemoteDescription(offer);

      const answer = await peer.createAnswer();
      await peer.setLocalDescription(answer);

      send("answer", {
        answer: {
          type: peer.localDescription.type,
          sdp: peer.localDescription.sdp
        }
      });
      setStatus("Camera active — connecting to viewer…", true);
    }

    async function handleSignal(message) {
      const data = message.data ?? message;

      switch (message.type) {
        case "ready":
          setStatus("Connected to signaling server. Starting camera…");
          break;

        case "peer-ready":
          setStatus("Viewer detected. Preparing camera connection…", true);
          break;

        case "offer":
          await handleOffer(data.offer ?? data);
          break;

        case "ice":
          if (peer && data.candidate) {
            try {
              await peer.addIceCandidate(data.candidate);
            } catch (error) {
              console.warn("Could not add ICE candidate:", error);
            }
          }
          break;

        case "set-camera":
          if (data.facingMode === "user" || data.facingMode === "environment") {
            try {
              await startCamera(data.facingMode);
              send("camera-facing", { facingMode: data.facingMode });
            } catch (error) {
              setStatus(`Could not switch camera: ${error.message}`, !!localStream);
            }
          }
          break;

        case "hangup":
          if (peer) {
            peer.close();
            peer = null;
          }
          setStatus("Viewer disconnected. Camera is still active.", !!localStream);
          break;

        default:
          console.log("Signaling message:", message.type);
      }
    }

    async function connectSignaling() {
      if (stopped) return;

      try {
        authToken = await getToken();
        const wsUrl = new URL(`${WORKER_URL}/session`);
        wsUrl.protocol = wsUrl.protocol === "https:" ? "wss:" : "ws:";
        wsUrl.searchParams.set("room", ROOM);

        ws = new WebSocket(wsUrl.toString());

        ws.onopen = () => {
          ws.send(JSON.stringify({ type: "auth", token: authToken }));
        };

        ws.onmessage = async event => {
          try {
            await handleSignal(JSON.parse(event.data));
          } catch (error) {
            console.error("Could not process signaling message:", error);
          }
        };

        ws.onerror = () => setStatus("Signaling connection error. Retrying…", !!localStream);

        ws.onclose = () => {
          if (stopped) return;
          setStatus("Signaling disconnected. Reconnecting…", !!localStream);
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connectSignaling, 2500);
        };
      } catch (error) {
        setStatus(error.message);
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectSignaling, 4000);
      }
    }

    async function init() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("Camera access is unavailable. Open this page over HTTPS in a supported browser.");
        return;
      }

      try {
        // The browser may ask for camera permission.
        await startCamera("user");
        await connectSignaling();
      } catch (error) {
        setStatus(`Camera could not start: ${error.message}`);
      }
    }

    window.addEventListener("pagehide", () => {
      stopped = true;
      clearTimeout(reconnectTimer);
      if (ws) ws.close();
      if (peer) peer.close();
      if (localStream) localStream.getTracks().forEach(track => track.stop());
    });

    init();
  </script>
</body>
</html>
