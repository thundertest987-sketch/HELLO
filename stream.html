
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Lab — Streamer</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 28px auto;
      padding: 0 16px;
    }
    video {
      width: 100%;
      background: #111;
      border-radius: 12px;
      margin-top: 12px;
    }
    button, select {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      font: inherit;
    }
    #status {
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>Camera Lab — Streamer</h1>
  <p>Authentication runs automatically. The camera stays off until you start streaming.</p>

  <label for="camera">Camera</label>
  <select id="camera">
    <option value="environment">Rear camera</option>
    <option value="user">Front camera</option>
  </select>

  <button id="start" disabled>Start Streaming</button>
  <button id="switch" disabled>Switch Camera</button>
  <button id="stop" disabled>Stop Streaming</button>

  <p id="status" role="status">Authenticating...</p>
  <video id="preview" autoplay playsinline muted></video>

<script>
"use strict";

const API = "https://private-camera-signal.thundertest987.workers.dev";
const SIGNAL_URL = API.replace(/^https:/, "wss:") + "/session";

// Obtain a short-lived phone session token from a protected backend.
// Do not embed CAMERA_PHONE_SECRET in this public file.
const AUTH_URL = "/api/phone-session";

const status = document.getElementById("status");
const preview = document.getElementById("preview");
const startButton = document.getElementById("start");
const switchButton = document.getElementById("switch");
const stopButton = document.getElementById("stop");
const cameraSelect = document.getElementById("camera");

let token = null;
let socket = null;
let peer = null;
let cameraStream = null;
let started = false;
let pendingCandidates = [];

function say(message) {
  status.textContent = message;
}

function send(type, data = null) {
  if (socket?.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type, data }));
  }
}

async function authenticateAutomatically() {
  try {
    const response = await fetch(AUTH_URL, {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ role: "phone" })
    });

    if (!response.ok) {
      throw new Error("Automatic authentication service is not configured.");
    }

    const result = await response.json();
    if (!result.token) throw new Error("No session token returned.");

    token = result.token;
    startButton.disabled = false;
    say("Phone authenticated. Tap Start Streaming when ready.");
  } catch (error) {
    say(error.message);
  }
}

async function startStreaming() {
  if (!token || started) return;

  started = true;
  startButton.disabled = true;
  say("Connecting to signaling service...");

  try {
    socket = new WebSocket(SIGNAL_URL);

    socket.onopen = () => {
      socket.send(JSON.stringify({ type: "auth", token }));
    };

    socket.onmessage = async event => {
      const message = JSON.parse(event.data);

      try {
        if (message.type === "ready") {
          say("Authenticated. Waiting for laptop viewer.");
        }

        if (message.type === "peer-ready") {
          say("Laptop connected. Waiting for its offer.");
        }

        if (message.type === "offer") {
          await answerOffer(message.data);
        }

        if (message.type === "ice" && message.data && peer) {
          if (peer.remoteDescription) {
            await peer.addIceCandidate(message.data);
          } else {
            pendingCandidates.push(message.data);
          }
        }

        if (message.type === "peer-left") {
          say("Laptop disconnected.");
        }
      } catch (error) {
        say("Connection error: " + error.message);
      }
    };

    socket.onerror = () => say("Signaling connection failed.");
    socket.onclose = () => {
      if (started) say("Signaling connection closed.");
    };
  } catch (error) {
    say("Could not connect: " + error.message);
    stopStreaming();
  }
}

async function answerOffer(offer) {
  if (!started) return;

  // Camera permission is requested only after Start Streaming.
  if (!cameraStream) {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: cameraSelect.value },
      audio: false
    });
    preview.srcObject = cameraStream;
  }

  if (peer) peer.close();

  peer = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });

  cameraStream.getTracks().forEach(track => peer.addTrack(track, cameraStream));

  peer.onicecandidate = event => {
    if (event.candidate) send("ice", event.candidate);
  };

  peer.onconnectionstatechange = () => {
    if (peer?.connectionState === "connected") {
      say("Streaming live to laptop.");
    } else if (peer?.connectionState === "failed") {
      say("WebRTC failed. A TURN relay may be required.");
    }
  };

  await peer.setRemoteDescription(offer);

  for (const candidate of pendingCandidates) {
    try { await peer.addIceCandidate(candidate); } catch {}
  }
  pendingCandidates = [];

  const answer = await peer.createAnswer();
  await peer.setLocalDescription(answer);
  send("answer", peer.localDescription);

  stopButton.disabled = false;
  switchButton.disabled = false;
  say("Camera active. Establishing video connection...");
}

async function switchCamera() {
  if (!started || !cameraStream || !peer) return;

  const facing = cameraSelect.value === "environment" ? "user" : "environment";

  try {
    const next = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing },
      audio: false
    });

    const track = next.getVideoTracks()[0];
    const sender = peer.getSenders().find(s => s.track?.kind === "video");
    if (!sender) throw new Error("Video sender unavailable.");

    await sender.replaceTrack(track);
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = next;
    cameraSelect.value = facing;
    preview.srcObject = cameraStream;
    say("Camera switched.");
  } catch (error) {
    say("Unable to switch camera: " + error.message);
  }
}

function stopStreaming() {
  started = false;

  if (socket?.readyState === WebSocket.OPEN) {
    send("hangup");
    socket.close();
  }

  if (peer) peer.close();
  if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());

  socket = null;
  peer = null;
  cameraStream = null;
  pendingCandidates = [];
  preview.srcObject = null;

  startButton.disabled = !token;
  switchButton.disabled = true;
  stopButton.disabled = true;
  say("Stopped. Camera tracks released.");
}

startButton.addEventListener("click", startStreaming);
switchButton.addEventListener("click", switchCamera);
stopButton.addEventListener("click", stopStreaming);
window.addEventListener("pagehide", stopStreaming);

// Authenticate when the page opens; no credential form is shown.
authenticateAutomatically();
</script>
</body>
</html>
