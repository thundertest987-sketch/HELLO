
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Lab — Streamer</title>
  <style>
    body {
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #111;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 0;
      border-radius: 6px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #ddd;
      color: #888;
      cursor: not-allowed;
    }

    #status {
      padding: 15px;
      margin-top: 20px;
      border-radius: 8px;
      background: #eef3f8;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>Camera Lab — Streamer</h1>

  <p>
    Authentication runs automatically. The camera stays off until
    you press Start Streaming.
  </p>

  <button id="start" disabled>Start Streaming</button>
  <button id="stop" disabled>Stop Streaming</button>

  <div id="status" role="status" aria-live="polite">
    Authenticating…
  </div>

<script>
"use strict";

const WORKER_URL =
  "https://private-camera-signal.thundertest987.workers.dev";

const PHONE_SECRET = "CAMERA_PHONE_SECRET";
const AUTH_URL = WORKER_URL + "/auth";
const SIGNAL_URL =
  WORKER_URL.replace(/^https:/, "wss:") + "/session";

const ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" }
];

const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");
const statusBox = document.getElementById("status");

let token = null;
let socket = null;
let peer = null;
let localStream = null;
let pendingOffer = null;
let started = false;
let stopped = false;
let facingMode = "user";
let authTimer = null;

function status(message) {
  statusBox.textContent = message;
}

function send(message) {
  if (!socket || socket.readyState !== WebSocket.OPEN) {
    status("Signaling connection is not ready.");
    return false;
  }

  socket.send(JSON.stringify(message));
  return true;
}

/* Authenticate against the existing Cloudflare Worker. */
async function authenticate() {
  status("Authenticating phone…");

  const response = await fetch(AUTH_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      role: "phone",
      secret: PHONE_SECRET
    })
  });

  if (!response.ok) {
    throw new Error(
      "Phone authentication failed: HTTP " + response.status
    );
  }

  const data = await response.json();

  if (!data.token) {
    throw new Error("The Worker did not return an authentication token.");
  }

  token = data.token;
}

/*
 * Connect to the Durable Object WebSocket.
 *
 * The Worker must send an authentication acknowledgement after
 * accepting the token. Supported acknowledgements are listed below.
 */
function connectSignaling() {
  return new Promise((resolve, reject) => {
    socket = new WebSocket(SIGNAL_URL);
    let authenticated = false;
    let settled = false;

    function fail(error) {
      if (settled) return;
      settled = true;
      clearTimeout(authTimer);
      reject(error);
    }

    authTimer = setTimeout(() => {
      if (!authenticated) {
        fail(new Error(
          "WebSocket authentication timed out. Check the Worker acknowledgement."
        ));
        socket.close();
      }
    }, 15000);

    socket.onopen = () => {
      socket.send(JSON.stringify({
        type: "auth",
        token
      }));
    };

    socket.onmessage = async event => {
      let message;

      try {
        message = JSON.parse(event.data);
      } catch {
        status("Worker returned a non-JSON message.");
        return;
      }

      if (!authenticated) {
        if (
          message.type === "authenticated" ||
          message.type === "auth_ok" ||
          message.type === "ready" ||
          message.ok === true
        ) {
          authenticated = true;
          settled = true;
          clearTimeout(authTimer);

          startButton.disabled = false;
          status("Authenticated. Press Start Streaming to turn on the camera.");
          resolve();
          return;
        }

        if (message.type === "error" || message.error) {
          fail(new Error(
            message.error || "WebSocket authentication failed."
          ));
        }

        return;
      }

      await handleSignal(message);
    };

    socket.onerror = () => {
      if (!authenticated) {
        fail(new Error("Could not connect to the Worker WebSocket."));
      }
    };

    socket.onclose = () => {
      clearTimeout(authTimer);

      if (!stopped) {
        startButton.disabled = true;
        stopButton.disabled = true;
        stopCamera();
        status("Signaling connection closed. Reload to reconnect.");
      }
    };
  });
}

/* Create the WebRTC peer connection. */
function createPeer() {
  closePeer();

  peer = new RTCPeerConnection({
    iceServers: ICE_SERVERS
  });

  peer.onicecandidate = event => {
    if (event.candidate) {
      send({
        type: "ice",
        candidate: event.candidate
      });
    }
  };

  peer.onconnectionstatechange = () => {
    if (!peer) return;

    switch (peer.connectionState) {
      case "connected":
        status("Connected. Streaming is active.");
        break;

      case "failed":
        status(
          "WebRTC connection failed. A TURN server may be needed."
        );
        break;

      case "disconnected":
        status("Viewer connection interrupted.");
        break;
    }
  };

  return peer;
}

/* Start camera only after the user presses the button. */
async function startCamera() {
  if (started || !token) return;

  startButton.disabled = true;
  status("Requesting camera permission…");

  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Camera access is unavailable in this browser.");
    }

    localStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    started = true;
    stopButton.disabled = false;

    if (pendingOffer) {
      const offer = pendingOffer;
      pendingOffer = null;
      await answerOffer(offer);
    } else {
      status("Camera is on. Waiting for the viewer's offer…");
    }
  } catch (error) {
    stopCamera();
    startButton.disabled = false;
    status("Could not start camera: " + error.message);
  }
}

/*
 * Extract and validate an offer.
 * A valid SDP string normally begins with "v=0".
 */
function extractOffer(message) {
  const candidates = [
    message?.offer,
    message?.description,
    message?.payload?.offer,
    message?.data?.offer,
    message
  ];

  for (const candidate of candidates) {
    if (
      candidate &&
      candidate.type === "offer" &&
      typeof candidate.sdp === "string" &&
      candidate.sdp.startsWith("v=")
    ) {
      return {
        type: "offer",
        sdp: candidate.sdp
      };
    }
  }

  return null;
}

/* Accept an offer and return an answer. */
async function answerOffer(message) {
  const offer = extractOffer(message);

  if (!offer) {
    console.error("Invalid offer received from Worker:", message);
    status(
      "Invalid WebRTC offer received. The Worker must forward the viewer's offer object."
    );
    return;
  }

  if (!localStream) {
    pendingOffer = offer;
    status("Viewer offer received. Press Start Streaming to continue.");
    return;
  }

  try {
    const pc = peer || createPeer();

    for (const track of localStream.getTracks()) {
      const exists = pc.getSenders().some(
        sender => sender.track === track
      );

      if (!exists) {
        pc.addTrack(track, localStream);
      }
    }

    await pc.setRemoteDescription(offer);

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    send({
      type: "answer",
      answer: {
        type: pc.localDescription.type,
        sdp: pc.localDescription.sdp
      }
    });

    status("Answer sent. Establishing video connection…");
  } catch (error) {
    console.error("Offer processing failed:", error, message);
    status("WebRTC error: " + error.message);
  }
}

/* Switch the phone's camera when commanded by the viewer. */
async function switchCamera(mode) {
  if (mode !== "user" && mode !== "environment") return;

  facingMode = mode;

  if (!started || !localStream) {
    status(
      "Camera preference saved. Start streaming to apply the change."
    );
    return;
  }

  let replacementStream;

  try {
    replacementStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    const newTrack = replacementStream.getVideoTracks()[0];

    if (!newTrack) {
      throw new Error("No video track was returned by the camera.");
    }

    if (peer) {
      const sender = peer.getSenders().find(
        item => item.track?.kind === "video"
      );

      if (sender) {
        await sender.replaceTrack(newTrack);
      } else {
        peer.addTrack(newTrack, replacementStream);
      }
    }

    const previousStream = localStream;
    localStream = replacementStream;
    previousStream.getTracks().forEach(track => track.stop());

    status(
      "Switched to " +
      (facingMode === "user" ? "front" : "back") +
      " camera."
    );
  } catch (error) {
    if (replacementStream) {
      replacementStream.getTracks().forEach(track => track.stop());
    }

    status("Camera switch failed: " + error.message);
  }
}

/* Handle messages forwarded by the Worker. */
async function handleSignal(message) {
  try {
    switch (message.type) {
      case "offer":
        await answerOffer(message);
        break;

      case "ice": {
        const candidate = message.candidate;

        if (peer && candidate) {
          await peer.addIceCandidate(
            new RTCIceCandidate(candidate)
          );
        }
        break;
      }

      case "set-camera":
      case "camera-facing":
        await switchCamera(
          message.facingMode || message.camera
        );
        break;

      case "peer-ready":
        status("Viewer is ready. Waiting for a valid offer…");
        break;

      case "hangup":
        closePeer();
        status("Viewer disconnected.");
        break;

      case "error":
        status("Worker error: " + (message.error || "Unknown error"));
        break;
    }
  } catch (error) {
    console.error("Signaling message handling failed:", error, message);
    status("Signaling error: " + error.message);
  }
}

function stopCamera() {
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }

  started = false;
  stopButton.disabled = true;
}

function closePeer() {
  if (peer) {
    peer.onicecandidate = null;
    peer.onconnectionstatechange = null;
    peer.close();
    peer = null;
  }
}

/* Explicitly stop the stream and release the camera. */
function stopStreaming() {
  send({ type: "hangup" });

  closePeer();
  stopCamera();
  pendingOffer = null;

  startButton.disabled =
    !token || !socket || socket.readyState !== WebSocket.OPEN;

  status("Streaming stopped. Camera is off.");
}

startButton.addEventListener("click", startCamera);
stopButton.addEventListener("click", stopStreaming);

window.addEventListener("pagehide", () => {
  stopped = true;
  closePeer();
  stopCamera();

  if (socket) {
    socket.close();
  }
});

/* Initialize authentication and signaling. */
async function initialize() {
  try {
    await authenticate();
    await connectSignaling();
  } catch (error) {
    console.error(error);
    status(error.message);
  }
}

initialize();
</script>
</body>
</html>
