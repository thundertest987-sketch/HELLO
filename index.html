
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Camera Preview Lab</title>
</head>
<body>
  <h2>Local Camera Preview Lab</h2>
  <p>Preview only. No recording or uploading.</p>

  <button id="start">Start camera preview</button>
  <button id="stop">Stop camera</button>

  <p id="status">Camera stopped.</p>
  <video id="preview" autoplay playsinline
         muted style="width:100%;max-width:480px"></video>

  <script>
    let stream = null;
    const video = document.getElementById("preview");
    const status = document.getElementById("status");

    document.getElementById("start").onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;
        status.textContent =
          "Camera active. Preview is local to this page.";
      } catch (error) {
        status.textContent =
          "Camera unavailable: " + error.name;
      }
    };

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
      status.textContent = "Camera stopped.";
    }

    document.getElementById("stop").onclick = stopCamera;
    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
