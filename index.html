
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Permission Lab</title>
</head>
<body>
  <h2>Mobile Permission Lab</h2>
  <p>No recording, saving, or uploading.</p>

  <button id="camera">Test camera permission</button>
  <button id="mic">Test microphone permission</button>
  <p id="status">Ready to test.</p>

  <script>
    async function testSensor(kind) {
      const status = document.getElementById("status");

      if (!navigator.mediaDevices?.getUserMedia) {
        status.textContent =
          "Unavailable. Use HTTPS and a supported browser.";
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: kind === "camera",
          audio: kind === "mic"
        });

        stream.getTracks().forEach(track => track.stop());
        status.textContent =
          "Permission granted. All media tracks stopped. Nothing recorded or uploaded.";
      } catch (e) {
        status.textContent = "Access not granted: " + e.name;
      }
    }

    document.getElementById("camera").onclick =
      () => testSensor("camera");

    document.getElementById("mic").onclick =
      () => testSensor("mic");
  </script>
</body>
</html>
